name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to make the stable release, e.g. 1.0.0
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release edit "v$VERSION" -R "$GITHUB_REPOSITORY" --prerelease=false --latest
