name: build

on:
  repository_dispatch:
    types: [app-main]
  workflow_dispatch:
    inputs:
      ref:
        description: kestrel commit SHA or branch
        required: true
        default: main
      publish:
        description: Publish a beta release (off = build and test only)
        type: boolean
        default: false

concurrency:
  group: build-${{ github.event.client_payload.sha || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_REPO: orielworkshq/kestrel
  PYTHON_VERSION: "3.15"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          if [ "$EVENT" = "repository_dispatch" ] || [ "$PUBLISH_INPUT" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: orielworkshq
          repositories: kestrel
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ github.event.client_payload.sha || inputs.ref }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          path: app
      - id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('app/pyproject.toml','rb'))['project']['version'])")
          code=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('app/src/kestrel/__init__.py').read()).group(1))")
          if [ "$version" != "$code" ]; then
            echo "::error::pyproject version $version != __version__ $code"
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version $version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released; bump the version on dev and release again"
            exit 1
          fi

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: orielworkshq
          repositories: kestrel
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --quiet -c requirements-dev.lock -e ".[dev]"
      - run: python -m ruff check src tests packaging
      - run: python -m mypy src
      - run: python -m pytest -q

  build-windows:
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: orielworkshq
          repositories: kestrel
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: powershell -ExecutionPolicy Bypass -File packaging\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/kestrel-${{ needs.prepare.outputs.version }}-windows.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: [prepare, test]
    runs-on: macos-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: orielworkshq
          repositories: kestrel
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: KESTREL_BUILD_PYTHON=python bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/kestrel-${{ needs.prepare.outputs.version }}-macos.zip
            dist/kestrel-${{ needs.prepare.outputs.version }}-macos.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build-windows, build-macos]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - working-directory: out
        run: sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh release create "v$VERSION" out/* \
            -R "$GITHUB_REPOSITORY" \
            --title "Kestrel $VERSION" \
            --notes "Build of ${SHA:0:12}. Beta until promoted." \
            --prerelease
